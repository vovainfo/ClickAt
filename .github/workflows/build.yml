name: Windows build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Build ClickAt for Windows x64
        shell: cmd
        run: build.cmd

      - name: Check release version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Item .\build\ClickAt.exe).VersionInfo.ProductVersion
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $version."
          }

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ClickAt-Windows-x64
          path: build/ClickAt.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ClickAt-Windows-x64
          path: dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/ClickAt.exe `
              --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/ClickAt.exe `
              --repo $env:GITHUB_REPOSITORY --verify-tag `
              --title "ClickAt $env:GITHUB_REF_NAME" --generate-notes
          }
          exit $LASTEXITCODE
